name: Sync Zotero bibliography

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install bibtex-ruby
        run: gem install bibtex-ruby --no-document

      - name: Sync papers.bib from Zotero My Publications
        run: ruby bin/sync_zotero_bibliography.rb

      - name: Commit and push if the bibliography changed
        run: |
          if git diff --quiet -- _bibliography/papers.bib; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git commit -m "Sync publications from Zotero"
          git push
