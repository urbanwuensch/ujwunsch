name: Sync Zotero bibliography

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install bibtex-ruby
        run: gem install bibtex-ruby --no-document

      - name: Sync papers.bib from Zotero My Publications
        run: ruby bin/sync_zotero_bibliography.rb

      - name: Open PR if the bibliography changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync publications from Zotero"
          title: "Sync publications from Zotero My Publications"
          body: |
            Automated refresh of `_bibliography/papers.bib` from the public
            [Zotero My Publications](https://www.zotero.org/urbanwunsch) library.

            Generated by `bin/sync_zotero_bibliography.rb`, run on schedule by
            `.github/workflows/sync-zotero.yml`. Review the diff before merging —
            this only pulls data, it does not publish anything on its own.
          branch: sync/zotero-bibliography
          delete-branch: true
          add-paths: _bibliography/papers.bib
